desc_dagger: Its handle is beautifully carved; the blade is bronze and very sharp!
desc_carrot: This is one of the tastiest looking carrots you have ever seen.
desc_golden_walnut: You proudly admire your gold walnut.
desc_walnut: It seems to be a good, solid walnut.
0-1: You splash around in the water for a while but seem  to have forgotten how to swim. Unfortunately, you drown.
0-2: Where do you think it could be?
0-3: The goat is not much for conversation.
0-4: "Ye best be careful, young Graham.  The mystic protective spell of mine has weakened and departed."
0-5: KQ1
0-6: You feel a stretching sensation... Oh, you're back to your original size.
0-7: You're too busy right now to rub the ring.
0-8: There is no reason to do that now.
0-9: You had the dagger and lost it.  Sorry.
0-16: Mmmm!  There's nothing like a crisp, fresh carrot.
0-18: You already have a carrot.
0-19: You already ate the carrot.
0-40: You're welcome!
0-53: You have already opened the walnut.
0-54: When you open the walnut, you discover the nut inside is pure gold!
0-55: Ouch!  It would be much easier if you opened the walnut first.
0-56: Don't do that!  This walnut is not edible since it is pure gold.
1-1: Misfortune strikes and you have fallen into the moat. Your struggles and cries have attracted hungry alligators.  They do not want to let you go.
1-2: King Edward's banners are waving in the strong breeze.
1-3: This is the castle of King Edward the Benevolent.
1-4: It looks deep and dangerous.  You can see alligators  floating in the water.
1-5: The water in the moat is not conducive to swimming.
1-6: They are absolutely gorgeous!
1-7: It is a very small,  wooden barrel bridge.
1-8: The alligators are swimming in the moat.
1-9: There are alligators in this water.  I don't think you want to try drinking it.
1-10: You fill the bucket with the murky water from the moat.
1-11: There is water nearby.
1-12: You need to get closer to the water.
1-13: King Edward does not allow anyone to take his flowers.
1-14: The moats slippery sides prevent you from getting out.
1-15: What!  Are you crazy?
1-16: You are standing outside a castle surrounded by an alligator filled moat.
2-1: High above the castle, the flags are waving in the wind.
2-2: King Edward the Benevolent, the mighty ruler of Daventry, lives in this castle.
2-3: You must enter the castle through the door, and the  door is closed.
2-4: "It's your typical moat water: murky and smelly."
2-5: You never know what might be in there!
2-6: It is a rather small, wooden bridge.
2-7: These alligators have protected the castle from many a trespasser.
2-8: They pose as immovable guards for King Edward's castle, and have frightened off numerous intruders.
2-9: These doors are strongly built to keep out unwanted visitors.
2-10: You can't see them from here.
2-11: As you kneel by the edge of the moat and see just how filthy the water is, your thirst strangely leaves you.
2-12: Although you notice the water is unclean, you fill the bucket.
2-13: You are not close enough to any water.
2-14: You have no container for water.
2-15: You have been to the castle once and you may not return until your quest is complete.
2-16: You have been to the castle once since your quest and  are not allowed to return again.
2-17: Since the goat is with you, permission to enter the  castle is denied.
2-18: You cannot reach the door from here.
2-19: The door is already closed.
2-21: Misfortune strikes and you have fallen into the moat. Your struggles and cries have attracted hungry alligators.  They do not want to let you go.
2-22: They are absolutely gorgeous!
2-23: King Edward does not allow anyone to take his flowers.
2-25: The huge doors swing open slowly.
2-26: The moats slippery sides prevent you from getting out.
2-27: What!  Are you crazy?
2-28: Your knock echos within the castle.  Unfortunately, no one answers.
2-29: You are standing outside a castle surrounded by an alligator filled moat.
55-1: The light from the oil lamp is rather dim in the dark interior of the castle.
55-2: There is nobody in the armor.
55-3: This is the armor of one of King Edward's knights from years ago.
55-4: The armor is firmly mounted to the wall.
55-5: The long marble hall has a cold, dreary feeling.
